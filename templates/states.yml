# Career-Ops — Canonical States
# Source of truth for career-ops (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md must contain EXACTLY
# one of these values (case-insensitive). No markdown bold (**),
# no dates, no extra text. Dates go in the date column.

states:
  - id: triaged
    label: Triaged
    aliases: [triage, scored]
    description: Title+company-keyword score assigned by triage script; per-JD eval not yet done. Promote to Evaluated after WebFetch+report.
    dashboard_group: evaluated

  - id: evaluated
    label: Evaluated
    aliases: [evaluada]
    description: Offer evaluated with report, pending decision
    dashboard_group: evaluated

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: interview
    label: Interview
    aliases: [entrevista]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta]
    description: Offer received
    dashboard_group: offer

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada]
    description: Rejected by company
    dashboard_group: rejected

  - id: rejected_at_eval
    label: Rejected-at-eval
    aliases: [rejected-at-eval, rejected_at_eval, eval-reject, screened-out]
    description: >-
      Eval agent judged the role not a fit on the merits (no sponsorship, ITAR,
      level mismatch, comp below floor). A verdict about the role, not about a
      dead link and not the candidate's own call. Written by eval agents only.
    dashboard_group: rejected_at_eval

  - id: purged
    label: Purged
    aliases: [purge, auto-discarded, age-purged, liveness-purged]
    description: >-
      Removed mechanically, with no judgement about the role: posting went dead
      (liveness sweep), or it sat unapplied past the shelf life (age purge), or
      the req was too old at intake (STALE-REQ). Written by hygiene-sweep.mjs
      and the dashboard --expire-days sweep only.
    dashboard_group: purged

  - id: discarded
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada]
    description: >-
      The candidate's own call, made by hand in the dashboard (d key). Nothing
      automated may write this status: see rejected_at_eval for agent verdicts
      and purged for mechanical sweeps.
    dashboard_group: discarded

  - id: skip
    label: SKIP
    aliases: [no_aplicar, no aplicar, skip, monitor]
    description: Doesn't fit, don't apply
    dashboard_group: skip
