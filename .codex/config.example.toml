[mcp_servers.playwright]
command = "/bin/sh"
args = [
    "-lc",
    'exec npx -y @playwright/mcp@latest --user-data-dir "$HOME/.career-ops/browser-profile"',
]
startup_timeout_sec = 30

[shell_environment_policy]
inherit = "core"

# Keep credentials in the shell environment or an ignored local
# .codex/config.toml. Never add credential values to this example.
