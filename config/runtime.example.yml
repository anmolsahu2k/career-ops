# Copy to a local path such as config/runtime.local.yml. Provider and model
# names live here only; deterministic policy never branches on a model name.
runtime_version: 1
api_billing: false
subscription_overage: false
writer_host: windows-spare

reserves:
  minimum_ratio: 0.20
  emergency_ratio: 0.05
  adaptive: true

# Copy this block to ignored config/runtime.local.yml and explicitly opt in.
# The checked-in default cannot navigate or submit any job application.
applications:
  enabled: false
  auto_after_scan: false
  auto_submit: false
  # Calendar dates written to the tracker use this IANA time zone.
  time_zone: America/New_York
  chrome_profile_dir: ''
  chrome_channel: chrome
  # LinkedIn and Handshake attach to the already signed-in main Chrome.
  # Chrome 136+ ignores --remote-debugging-port on the daily profile.
  # Enable chrome://inspect/#remote-debugging and click Allow. Optional
  # user_data_dir overrides auto-detect of the live Chrome profile path
  # (DevToolsActivePort only; never copies User Data).
  main_profile:
    enabled: false
    cdp_url: 'http://127.0.0.1:9222'
    ats: [linkedin, handshake]
    apply_score_minimum: 3.5
    handshake:
      search_url: 'https://cmu.joinhandshake.com/stu/postings'
      job_types: [Full-Time]
      locations: [United States]
      include_remote: true
      posted_within_days: 21
      hide_applied: true
      keyword_source: target_roles
  resumes:
    sde: ''
    mle: ''
  supported_ats: [workday, greenhouse, ashby, lever, successfactors]
  max_steps: 8
  hosted_calls_per_application: 2
  # Bounded application prose (additional information, cover letters, and
  # prospective salary preference) uses this Antigravity list when local_prose
  # is disabled. An empty list disables hosted drafting. Prefer a single
  # Gemini 3.8 Flash Medium entry for production apply prose.
  hosted_fallback_providers: [antigravity-gemini-flash-medium]
  answer_evidence_files: []
  # Optional loopback-only prose canary. Keep disabled unless you explicitly
  # want a local Ollama model for review-only drafting. When enabled and
  # qualified, local salary/prose is tried before hosted_fallback_providers.
  local_prose:
    enabled: false
    canary_only: true
    # When true with local_prose.enabled, qualified local prose drafts cover
    # letters first. When false (recommended), hosted_fallback_providers drafts
    # the body. File-upload slots stay empty.
    cover_letters: false
    # Set true only after the application-prose qualification benchmark passes.
    qualified: false
    # Ignored artifact written by `career-ops apply qualify-local-prose`.
    qualification_artifact: ''
    provider: ollama-qwen3-4b
  gmail_otp:
    enabled: false
    python_command: python
    timeout_seconds: 180
    sender_domains:
      greenhouse: [greenhouse.io, greenhouse-mail.io]
      ashby: [ashbyhq.com]
      lever: [lever.co]
  artifact_retention_days: 14

resource_pools:
  chatgpt-plus:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  google-gemini:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  google-partner:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  cerebras-free:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  groq-free:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  provider-api:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  local-gpu:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: AVAILABLE
    remaining_ratio: 1
    minimum_reserve_ratio: 0
    emergency_reserve_ratio: 0

routing_profiles:
  career-ops-job-v1:
    triage:
      provider: antigravity-gemini-flash-low
      batch_size: 10
      authority: RANK_ONLY
    judgment:
      provider: codex-luna
      authority: ADVISORY_FULL_A_G
    escalation:
      provider: codex-sol
      authority: ADVISORY_REVIEW
      max_share: 0.20
      apply_score_minimum: 4.0
      boundary_minimum: 3.8
      boundary_maximum: 4.2
      confidence_minimum: 0.85
      contradiction_reason_codes: [EVIDENCE_CONFLICT, SENIORITY_CONFLICT, COMPENSATION_CONFLICT, ROLE_FIT_CONFLICT]
      missing_evidence_reason_codes: [REQUIRED_EVIDENCE_INCOMPLETE, SCORE_MISSING, LIVENESS_UNCERTAIN, CONSEQUENTIAL_GATE_UNKNOWN]

# Providers start disabled and unqualified. `doctor`, the qualification harness,
# shadow, and canary stages must populate fresh observations and qualifications.
providers:
  codex-terra:
    type: codex_cli
    enabled: false
    command: [codex, exec, --model, gpt-5.6-terra, --config, 'model_reasoning_effort="high"', --sandbox, read-only, --ephemeral, --ignore-user-config, --ignore-rules, --skip-git-repo-check, '-']
    input_mode: stdin_text
    usage_mode: codex_total
    isolated_workspace: true
    json_schema_file: schemas/runtime/provider-response.v1.schema.json
    shadow_json_schema_file: schemas/runtime/qualification-batch-response.v1.schema.json
    json_schema_flag: --output-schema
    json_schema_mode: path
    model_vendor: openai
    model_family: gpt-5.6
    model_snapshot: gpt-5.6-terra
    execution_surface: codex-cli
    resource_pool: chatgpt-plus
