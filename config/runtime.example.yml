# Copy to a local path such as config/runtime.local.yml. Provider and model
# names live here only; deterministic policy never branches on a model name.
runtime_version: 1
api_billing: false
subscription_overage: false
writer_host: windows-spare

reserves:
  minimum_ratio: 0.20
  emergency_ratio: 0.05
  adaptive: true

resource_pools:
  chatgpt-plus:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  google-gemini:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  google-partner:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  provider-api:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: UNKNOWN
    remaining_ratio: 0
    minimum_reserve_ratio: 0.20
    emergency_reserve_ratio: 0.05
  local-gpu:
    schema: ResourcePoolV1
    schema_version: 1
    quota_state: AVAILABLE
    remaining_ratio: 1
    minimum_reserve_ratio: 0
    emergency_reserve_ratio: 0

# Providers start disabled and unqualified. `doctor`, the qualification harness,
# shadow, and canary stages must populate fresh observations and qualifications.
providers:
  codex-terra:
    type: codex_cli
    enabled: false
    command: [codex, exec, --model, gpt-5.6-terra, --config, 'model_reasoning_effort="high"', --sandbox, read-only, --ephemeral, --ignore-user-config, --ignore-rules, --skip-git-repo-check, '-']
    input_mode: stdin_text
    usage_mode: codex_total
    isolated_workspace: true
    json_schema_file: schemas/runtime/provider-response.v1.schema.json
    shadow_json_schema_file: schemas/runtime/qualification-batch-response.v1.schema.json
    json_schema_flag: --output-schema
    json_schema_mode: path
    model_vendor: openai
    model_family: gpt-5.6
    model_snapshot: gpt-5.6-terra
    execution_surface: codex-cli
    resource_pool: chatgpt-plus
    capability_class: CONSEQUENTIAL
    capabilities: [structured_output, evidence_citations]
    risk_ceiling: CONSEQUENTIAL
  codex-luna:
    type: codex_cli
    enabled: false
