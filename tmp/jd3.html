    <title>Forward Deployed Engineer, Perplexity Computer @ Perplexity</title><meta name="title" content="Forward Deployed Engineer, Perplexity Computer @ Perplexity" />
    
  
  <meta name="description" content="Perplexity is seeking a highly skilled and motivated Forward Deployed Engineer to ensure our customers are getting the most out of their Perplexity Computer deployments. This role is ideal for technical, consultative professionals who have driven complex software implementations for bleeding edge customers.


ABOUT THE ROLE

Perplexity Computer is a new class of AI system that navigates tools, interacts with applications, and completes multi-step enterprise workflows end-to-end. Our largest customers are Fortune 500 enterprises, top consulting firms, and frontier finance and legal shops. They are betting on Computer to automate work where no traditional software has ever succeeded.

Forward Deployed Engineers (FDEs) are the people we embed with customers to scope their highest-leverage use cases, and ship a working solution at velocity. You will leave your customers with something that drives measurable impact.

This is not a Solutions Engineer role, not a Customer Success role, and not a generalist implementation role. It is a customer-embedded, hands-on-keyboard, outcome-owning role that sits at the intersection of engineering, solutions architecture, and technical program management.


WHAT YOU&#39;LL DO

 - Embed with strategic customers on time-boxed engagements (typically 1–3 months) running the engagement like a project with clear scope, milestones, and exit criteria.

 - Design and build the workflow with support from engineering as needed. You will be hands-on-keyboard in Computer and adjacent tooling. You will prototype, ship, debug, and harden the solution in the customer&#39;s environment.

 - Own the customer relationship for the duration of the engagement: manage expectations with executive sponsors, run weekly working sessions with practitioner teams, and de-risk the deployment end-to-end.

 - Turn every engagement into leverage. Deployments should produce a reusable skill, connector, workflow template, or reference implementation that our next customer, our GTM team, or our Product team can build on.

 - Partner with Sales and Customer Success on scoping, pre-sales technical validation, and expansion. You are the technical voice in the room for our highest-value opportunities.


WHAT WE&#39;RE LOOKING FOR

The best FDEs we&#39;ve seen are roughly ⅓ engineer, ⅓ customer-facing solutions architect, ⅓ services-oriented program manager. You should be excellent at at least two of the three and credible in all three.

Must-haves

 - 5+ years in a customer-embedded technical role: forward-deployed engineering, senior solutions engineering, solutions architecture, or technical consulting at a strong services organization.

 - Proven track record running customer engagements as projects:  scoping, milestones, status, executive comms, risk management, exit criteria. You have said &quot;no&quot; and &quot;not yet&quot; to customers and made it stick.

 - AI-native. You use frontier LLMs, agents, and coding assistants daily and have strong intuition for what current models can and cannot do reliably.

 - Executive-credible communication. You can walk a CIO through architecture in a credible way while running the program on the ground as well.

 - High agency in ambiguity. No PM, no spec, no perfect requirements. You go in, figure out what matters, and ship.

Nice-to-haves

 - Prior FDE, applied-AI, or deployment-strategist role at a frontier AI company

 - Sales Engineering leadership at an enterprise SaaS or infra company where you owned the technical outcome of $1M+ deals

 - Solutions Architect in a strong services team

 - Experience deploying agents, RAG systems, or multi-step LLM workflows in a regulated or complex enterprise environment

 - History of working at startups or small teams, owning customer projects end-to-end" />

lue opportunities.</p></li></ul><p style=\"min-height:1.5em\"></p><h2>What we're looking for</h2><p style=\"min-height:1.5em\">The best FDEs we've seen are roughly <strong>⅓ engineer, ⅓ customer-facing solutions architect, ⅓ services-oriented program manager.</strong> You should be excellent at at least two of the three and credible in all three.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>Must-haves</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>5+ years</strong> in a customer-embedded technical role: forward-deployed engineering, senior solutions engineering, solutions architecture, or technical consulting at a strong services organization.</p></li><li><p style=\"min-height:1.5em\"><strong>Proven track record running customer engagements as projects</strong>:  scoping, milestones, status, executive comms, risk management, exit criteria. You have said \"no\" and \"not yet\" to customers and made it stick.</p></li><li><p style=\"min-height:1.5em\"><strong>AI-native.</strong> You use frontier LLMs, agents, and coding assistants daily and have strong intuition for what current models can and cannot do reliably.</p></li><li><p style=\"min-height:1.5em\"><strong>Executive-credible communication.</strong> You can walk a CIO through architecture in a credible way while running the program on the ground as well.</p></li><li><p style=\"min-height:1.5em\"><strong>High agency in ambiguity.</strong> No PM, no spec, no perfect requirements. You go in, figure out what matters, and ship.</p></li></ul><p style=\"min-height:1.5em\"><strong>Nice-to-haves</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Prior FDE, applied-AI, or deployment-strategist role at a frontier AI company</p></li><li><p style=\"min-height:1.5em\">Sales Engineering leadership at an enterprise SaaS or infra company where you owned the technical outcome of $1M+ deals</p></li><li><p style=\"min-height:1.5em\">Solutions Architect in a strong services team</p></li><li><p style=\"min-height:1.5em\">Experience deploying agents, RAG systems, or multi-step LLM workflows in a regulated or complex enterprise environment</p></li><li><p style=\"min-height:1.5em\">History of working at startups or small teams, owning customer projects end-to-end</p></li></ul>","secondaryLocationNames":[],"teamNames":["Sales"],"compensationTierSummary":"$200K – $250K • Offers Equity","compensationTiers":[{"id":"7ff4887c-11fe-4f6c-9a26-c320de89feec","title":null,"tierSummary":"$200K – $250K • Offers Equity"}],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":"$200K - $250K","compensationPhilosophyHtml":"<p style=\"min-height:1.5em\"><strong>U.S. Benefits</strong></p><p style=\"min-height:1.5em\">Full-time U.S. employees enjoy a comprehensive benefits program including equity, health, dental, vision, retirement, fitness, commuter and dependent care accounts, and more.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>International Benefits</strong></p><p style=\"min-height:1.5em\">Full-time employees outside the U.S. enjoy a comprehensive benefits program tailored to their region of residence.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">USD salary ranges apply only to U.S.-based positions. International salaries are set based on the local market. Final offer amounts are determined by multiple factors, including experience and expertise, and may vary from the amounts listed above.</p>","shouldAskForTextingConsent":false,"shouldAskForWhatsAppConsent":false,"legalEntityNameForTextingConsent":"Perplexity"},"jobBoard":null,"routerPrefix":"/","recaptchaPublicSiteKey":"6LeFb_YUAAAAALUD5h-BiQEp8JaFChe0e0A6r49Y","recaptchaUniversalPublicSiteKey":"6LezdY0tAAAAAEnollNLCAI0z1VDGwM7AzGrU4XZ"};
