  <meta name="description" content="ABOUT CLAY

Our mission is to help organizations turn any growth idea into reality.

We see growth as a creative practice, not a formula. Finding and reaching your best-fit customers takes unique ideas and constant iteration. As AI makes execution faster and tactics easier to copy, creativity is the only lasting advantage. We&#39;re already helping thousands of customers https://clayrun.notion.site/Wall-of-Love-b243f2b67607438b9fad99341e6b8d47 — including Anthropic, Notion, Google, and Ramp — go to market with unique data, signals, and AI research.

In 2025, we raised a $100M Series C  https://www.nytimes.com/2025/08/05/business/dealbook/clay-ai-marketing-fundraise.htmlbacked by world-class investors including Sequoia, CapitalG, and First Round — and crossed $100M in revenue.

In 2026, we announced our second employee tender offer https://www.nytimes.com/2026/01/28/business/dealbook/clay-start-up-tender-offers.html in 9 months at a new $5B valuation. We also launched a community equity round https://www.clay.com/blog/community-equity-offering, for our customers, agency partners, and club members.

Some things to know about us:

 - Our community http://community.clay.com includes 11,000+ customers, 150+ integration partners, 125+ agencies, 50+ Clay clubs https://luma.com/claylive, and 30k members on Slack.

 - Our culture https://nextplayso.substack.com/p/spotlight-clay is unique inside and outside of work. Our team members are also DJs, activists, writers, clowns, marathoners, skydivers, psychedelic therapists, social workers, and more.

 - All employees can work for free with world-class coaches who specialize in creativity, management, and more.

 - Our operating principles — including negative maintenance and non-attached action — guide our work. Read more about them here https://cdn.prod.website-files.com/61477f2c24a826836f969afe/685d83a71452245cc1129791_4d770abfd83e276ec15315a2e06945bd_Clay2025_OperatingPrinciples.pdf.

 - Read about us in the NYT https://www.nytimes.com/2025/08/05/business/dealbook/clay-ai-marketing-fundraise.html, Forbes http://google.com/search?q=forbes+clay&amp;rlz=1C5OZZY_enUS1155US1155&amp;oq=forbes+clay&amp;gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIHCAEQABiABDIHCAIQABiABDIHCAMQABiABDIHCAQQABiABDIHCAUQABiABDIHCAYQABiABDIHCAcQABiABDIHCAgQABiABDIHCAkQABiABNIBBzkzM2owajSoAgOwAgHxBVAe8UAxJx_p&amp;sourceid=chrome&amp;ie=UTF-8, First Round Review https://review.firstround.com/podcast/inside-clays-unconventional-path-to-1-25b/, and more https://www.clay.com/press.

Hear from our employees directly on our Glassdoor https://www.glassdoor.com/Overview/Working-at-Clay-EI_IE9850794.11,15.htm page!


THE ROLE:

We&#39;re looking for a backend product engineer to own the systems behind the parts of Clay our customers use every day. Clay is a product where the backend is the product — enrichment, signals, workflows, and agents are all surfaces where the engineering decision and the product decision are the same decision.

You&#39;ll own a surface end to end: deciding what to build with your design and GTM partners, shipping it quickly, watching real customers use it, and then making it faster, more reliable, and more capable. You&#39;ll wear both a PM hat and an engineering hat. There&#39;ll be no shortage of fun problems to explore and technical challenges to solve.


WHAT YOU&#39;LL DO

 - Own a product surface end to end. From problem definition through shipped, measured outcome. You&#39;ll help decide what gets built, not just how.

 - Wear the PM hat. Scope your own work with design, data science, and GTM partners. Write the spec, cut what doesn&#39;t matter, make the call, and defend it.

 - Talk to customers directly. Sit in on calls, read the tickets, watch people work inside Clay. The best backend product decisions here come from watching someone hit the wall in real time.

 - Ship fast, then learn. Small teams, short cycles, low process. We&#39;d rather get a real version in front of customers this month than a perfect one next quarter.

 - Build the systems that make features possible. Design the data models, APIs, and jobs behind new product capabilities — and keep them fast and reliable as usage climbs. Given our growth, real scaling problems land on your desk regularly, and solving them is part of shipping the product well.

 - Up-level the codebase. Negative maintenance is one of our operating principles. You&#39;ll improve the performance and reliability of Clay and raise the development velocity of the engineers around you.

 - Mentor and learn from other engineers. Help the team grow in the areas you&#39;re strong in, and learn from teammates with different strengths.


WHAT YOU&#39;LL BRING

 - A proven track record of execution. 4+ years of hands-on engineering experience building products people actually use.

 - You want to be a product manager as well as an engineer. Our product engineers drive and own their surfaces end to end. If you&#39;d rather be handed a fully-specced ticket, this isn&#39;t the role.

 - Strong backend fundamentals. API and schema design, SQL (preferably Postgres), query optimization, and the instinct to know when something will fall over before it does.

 - A bias toward impact and toward shipping. You&#39;re results-oriented, you sequence toward the version that teaches you the most, and you&#39;d rather learn from production than from a doc.

 - You&#39;re an empathetic communicator. You express nuanced ideas clearly at different levels of abstraction for different audiences. In disagreements, you prioritize curiosity over confrontation, making sure everyone feels heard and understood.

 - You care about craft. You translate a solution into bug-free, easily understandable code and raise the engineering bar for those around you.

 - Having a diversity of perspectives is important to you. You believe that having people with different backgrounds and perspectives creates a better team and a more holistic product.


NICE TO HAVES

 - Experience working with systems and data at scale — large-scale high-performance data pipelines, event ingestion systems, or larger production systems generally.

 - Depth in any of: Redis, Postgres, ElasticSearch, or OpenSearch.

 - Advanced proficiency optimizing serverless workloads on AWS.

 - Experience building with LLMs or agents as a product surface, not just a tool.

 - Experience with our current tech stack:

 - React, Typescript, Python, Node.js

 - AWS services: Aurora (Postgres), Elasticache (Redis), Elastic Container Registry (ECR), ECS (Fargate), Lambda, OpenSearch

 - IaC: Terraform

 - Deployment tools: CircleCI, Netlify, Playwright

 - Observability tools: Cloudwatch, Datadog, Mezmo" />

d more</u></a>.</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\">Hear from our employees directly on our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Clay-EI_IE9850794.11,15.htm\"><u>Glassdoor</u></a> page!</p><h2><strong>The Role:</strong></h2><p style=\"min-height:1.5em\">We're looking for a backend product engineer to own the systems behind the parts of Clay our customers use every day. Clay is a product where the backend <em>is</em> the product — enrichment, signals, workflows, and agents are all surfaces where the engineering decision and the product decision are the same decision.</p><p style=\"min-height:1.5em\">You'll own a surface end to end: deciding what to build with your design and GTM partners, shipping it quickly, watching real customers use it, and then making it faster, more reliable, and more capable. You'll wear both a PM hat and an engineering hat. There'll be no shortage of fun problems to explore and technical challenges to solve.</p><p style=\"min-height:1.5em\"></p><h1><strong>What You'll Do</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Own a product surface end to end.</strong> From problem definition through shipped, measured outcome. You'll help decide <em>what</em> gets built, not just how.</p></li><li><p style=\"min-height:1.5em\"><strong>Wear the PM hat.</strong> Scope your own work with design, data science, and GTM partners. Write the spec, cut what doesn't matter, make the call, and defend it.</p></li><li><p style=\"min-height:1.5em\"><strong>Talk to customers directly.</strong> Sit in on calls, read the tickets, watch people work inside Clay. The best backend product decisions here come from watching someone hit the wall in real time.</p></li><li><p style=\"min-height:1.5em\"><strong>Ship fast, then learn.</strong> Small teams, short cycles, low process. We'd rather get a real version in front of customers this month than a perfect one next quarter.</p></li><li><p style=\"min-height:1.5em\"><strong>Build the systems that make features possible.</strong> Design the data models, APIs, and jobs behind new product capabilities — and keep them fast and reliable as usage climbs. Given our growth, real scaling problems land on your desk regularly, and solving them is part of shipping the product well.</p></li><li><p style=\"min-height:1.5em\"><strong>Up-level the codebase.</strong> Negative maintenance is one of our operating principles. You'll improve the performance and reliability of Clay and raise the development velocity of the engineers around you.</p></li><li><p style=\"min-height:1.5em\"><strong>Mentor and learn from other engineers.</strong> Help the team grow in the areas you're strong in, and learn from teammates with different strengths.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>What You'll Bring</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>A proven track record of execution.</strong> 4+ years of hands-on engineering experience building products people actually use.</p></li><li><p style=\"min-height:1.5em\"><strong>You want to be a product manager as well as an engineer.</strong> Our product engineers drive and own their surfaces end to end. If you'd rather be handed a fully-specced ticket, this isn't the role.</p></li><li><p style=\"min-height:1.5em\"><strong>Strong backend fundamentals.</strong> API and schema design, SQL (preferably Postgres), query optimization, and the instinct to know when something will fall over before it does.</p></li><li><p style=\"min-height:1.5em\"><strong>A bias toward impact and toward shipping.</strong> You're results-oriented, you sequence toward the version that teaches you the most, and you'd rather learn from production than from a doc.</p></li><li><p style=\"min-height:1.5em\"><strong>You're an empathetic communicator.</strong> You express nuanced ideas clearly at different levels of abstraction for different audiences. In disagreements, you prioritize curiosity over confrontation, making sure everyone feels heard and understood.</p></li><li><p style=\"min-height:1.5em\"><strong>You care about craft.</strong> You translate a solution into bug-free, easily understandable code and raise the engineering bar for those around you.</p></li><li><p style=\"min-height:1.5em\"><strong>Having a diversity of perspectives is important to you.</strong> You believe that having people with different backgrounds and perspectives creates a better team and a more holistic product.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>Nice To Haves</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience working with systems and data at scale — large-scale high-performance data pipelines, event ingestion systems, or larger production systems generally.</p></li><li><p style=\"min-height:1.5em\">Depth in any of: Redis, Postgres, ElasticSearch, or OpenSearch.</p></li><li><p style=\"min-height:1.5em\">Advanced proficiency optimizing serverless workloads on AWS.</p></li><li><p style=\"min-height:1.5em\">Experience building with LLMs or agents as a product surface, not just a tool.</p></li><li><p style=\"min-height:1.5em\">Experience with our current tech stack:</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">React, Typescript, Python, Node.js</p></li><li><p style=\"min-height:1.5em\">AWS services: Aurora (Postgres), Elasticache (Redis), Elastic Container Registry (ECR), ECS (Fargate), Lambda, OpenSearch</p></li><li><p style=\"min-height:1.5em\">IaC: Terraform</p></li><li><p style=\"min-height:1.5em\">Deployment tools: CircleCI, Netlify, Playwright</p></li><li><p style=\"min-height:1.5em\">Observability tools: Cloudwatch, Datadog, Mezmo</p></li></ul>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Clay Labs","value":"9aeacdb4-2364-40b8-935e-c561af931b5a"},"datePosted r noreferrer nofollow\" href=\"https://www.nytimes.com/2025/08/05/business/dealbook/clay-ai-marketing-fundraise.html\"><u>NYT</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://google.com/search?q=forbes+clay&amp;rlz=1C5OZZY_enUS1155US1155&amp;oq=forbes+clay&amp;gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIHCAEQABiABDIHCAIQABiABDIHCAMQABiABDIHCAQQABiABDIHCAUQABiABDIHCAYQABiABDIHCAcQABiABDIHCAgQABiABDIHCAkQABiABNIBBzkzM2owajSoAgOwAgHxBVAe8UAxJx_p&amp;sourceid=chrome&amp;ie=UTF-8\"><u>Forbes</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://review.firstround.com/podcast/inside-clays-unconventional-path-to-1-25b/\"><u>First Round Review</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.clay.com/press\"><u>and more</u></a>.</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\">Hear from our employees directly on our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Clay-EI_IE9850794.11,15.htm\"><u>Glassdoor</u></a> page!</p><h2><strong>The Role:</strong></h2><p style=\"min-height:1.5em\">We're looking for a backend product engineer to own the systems behind the parts of Clay our customers use every day. Clay is a product where the backend <em>is</em> the product — enrichment, signals, workflows, and agents are all surfaces where the engineering decision and the product decision are the same decision.</p><p style=\"min-height:1.5em\">You'll own a surface end to end: deciding what to build with your design and GTM partners, shipping it quickly, watching real customers use it, and then making it faster, more reliable, and more capable. You'll wear both a PM hat and an engineering hat. There'll be no shortage of fun problems to explore and technical challenges to solve.</p><p style=\"min-height:1.5em\"></p><h1><strong>What You'll Do</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Own a product surface end to end.</strong> From problem definition through shipped, measured outcome. You'll help decide <em>what</em> gets built, not just how.</p></li><li><p style=\"min-height:1.5em\"><strong>Wear the PM hat.</strong> Scope your own work with design, data science, and GTM partners. Write the spec, cut what doesn't matter, make the call, and defend it.</p></li><li><p style=\"min-height:1.5em\"><strong>Talk to customers directly.</strong> Sit in on calls, read the tickets, watch people work inside Clay. The best backend product decisions here come from watching someone hit the wall in real time.</p></li><li><p style=\"min-height:1.5em\"><strong>Ship fast, then learn.</strong> Small teams, short cycles, low process. We'd rather get a real version in front of customers this month than a perfect one next quarter.</p></li><li><p style=\"min-height:1.5em\"><strong>Build the systems that make features possible.</strong> Design the data models, APIs, and jobs behind new product capabilities — and keep them fast and reliable as usage climbs. Given our growth, real scaling problems land on your desk regularly, and solving them is part of shipping the product well.</p></li><li><p style=\"min-height:1.5em\"><strong>Up-level the codebase.</strong> Negative maintenance is one of our operating principles. You'll improve the performance and reliability of Clay and raise the development velocity of the engineers around you.</p></li><li><p style=\"min-height:1.5em\"><strong>Mentor and learn from other engineers.</strong> Help the team grow in the areas you're strong in, and learn from teammates with different strengths.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>What You'll Bring</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>A proven track record of execution.</strong> 4+ years of hands-on engineering experience building products people actually use.</p></li><li><p style=\"min-height:1.5em\"><strong>You want to be a product manager as well as an engineer.</strong> Our product engineers drive and own their surfaces end to end. If you'd rather be handed a fully-specced ticket, this isn't the role.</p></li><li><p style=\"min-height:1.5em\"><strong>Strong backend fundamentals.</strong> API and schema design, SQL (preferably Postgres), query optimization, and the instinct to know when something will fall over before it does.</p></li><li><p style=\"min-height:1.5em\"><strong>A bias toward impact and toward shipping.</strong> You're results-oriented, you sequence toward the version that teaches you the most, and you'd rather learn from production than from a doc.</p></li><li><p style=\"min-height:1.5em\"><strong>You're an empathetic communicator.</strong> You express nuanced ideas clearly at different levels of abstraction for different audiences. In disagreements, you prioritize curiosity over confrontation, making sure everyone feels heard and understood.</p></li><li><p style=\"min-height:1.5em\"><strong>You care about craft.</strong> You translate a solution into bug-free, easily understandable code and raise the engineering bar for those around you.</p></li><li><p style=\"min-height:1.5em\"><strong>Having a diversity of perspectives is important to you.</strong> You believe that having people with different backgrounds and perspectives creates a better team and a more holistic product.</p><p style=\"min-height:1.5em\"></p></li></ul><h1><strong>Nice To Haves</strong></h1><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience working with systems and data at scale — large-scale high-performance data pipelines, event ingestion systems, or larger production systems generally.</p></li><li><p style=\"min-height:1.5em\">Depth in any of: Redis, Postgres, ElasticSearch, or OpenSearch.</p></li><li><p style=\"min-height:1.5em\">Advanced proficiency optimizing serverless workloads on AWS.</p></li><li><p style=\"min-height:1.5em\">Experience building with LLMs or agents as a product surface, not just a tool.</p></li><li><p style=\"min-height:1.5em\">Experience with our current tech stack:</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">React, Typescript, Python, Node.js</p></li><li><p style=\"min-height:1.5em\">AWS services: Aurora (Postgres), Elasticache (Redis), Elastic Container Registry (ECR), ECS (Fargate), Lambda, OpenSearch</p></li><li><p style=\"min-height:1.5em\">IaC: Terraform</p></li><li><p style=\"min-height:1.5em\">Deployment tools: CircleCI, Netlify, Playwright</p></li><li><p style=\"min-height:1.5em\">Observability tools: Cloudwatch, Datadog, Mezmo</p></li></ul>","secondaryLocationNames":[],"teamNames":["Engineering"],"compensationTierSummary":"$170K – $300K • Offers Equity","compensationTiers":[{"id":"47b8d8d5-fce8-4bdb-8f9c-2f82916e734f","title":null,"tierSummary":"$170K – $300K • Offers Equity"}],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":"$170K - $300K","compensationPhilosophyHtml":null,"shouldAskForTextingConsent":true,"shouldAskForWhatsAppConsent":false,"candidateTextingPrivacyPolicyUrl":"https://privacy.clay.com/policies","candidateTextingTermsAndConditionsUrl":"https://www.clay.com/terms-of-service","legalEntityNameForTextingConsent":"Clay"},"jobBoard":null,"routerPrefix":"/","recaptchaPublicSiteKey":"6LeFb_YUAAAAALUD5h-BiQEp8JaFChe0e0A6r49Y","recaptchaUniversalPublicSiteKey":"6LezdY0tAAAAAEnollNLCAI0z1VDGwM7AzGrU4XZ"};
