  <meta name="description" content="ABOUT CLAY

Our mission is to help organizations turn any growth idea into reality.

We see growth as a creative practice, not a formula. Finding and reaching your best-fit customers takes unique ideas and constant iteration. As AI makes execution faster and tactics easier to copy, creativity is the only lasting advantage. We&#39;re already helping thousands of customers https://clayrun.notion.site/Wall-of-Love-b243f2b67607438b9fad99341e6b8d47 — including Anthropic, Notion, Google, and Ramp — go to market with unique data, signals, and AI research.

In 2025, we raised a $100M Series C  https://www.nytimes.com/2025/08/05/business/dealbook/clay-ai-marketing-fundraise.htmlbacked by world-class investors including Sequoia, CapitalG, and First Round — and crossed $100M in revenue.

In 2026, we announced our second employee tender offer https://www.nytimes.com/2026/01/28/business/dealbook/clay-start-up-tender-offers.html in 9 months at a new $5B valuation. We also launched a community equity round https://www.clay.com/blog/community-equity-offering, for our customers, agency partners, and club members.

Some things to know about us:

 - Our community http://community.clay.com includes 11,000+ customers, 150+ integration partners, 125+ agencies, 50+ Clay clubs https://luma.com/claylive, and 30k members on Slack.

 - Our culture https://nextplayso.substack.com/p/spotlight-clay is unique inside and outside of work. Our team members are also DJs, activists, writers, clowns, marathoners, skydivers, psychedelic therapists, social workers, and more.

 - All employees can work for free with world-class coaches who specialize in creativity, management, and more.

 - Our operating principles — including negative maintenance and non-attached action — guide our work. Read more about them here https://cdn.prod.website-files.com/61477f2c24a826836f969afe/685d83a71452245cc1129791_4d770abfd83e276ec15315a2e06945bd_Clay2025_OperatingPrinciples.pdf.

 - Read about us in the NYT https://www.nytimes.com/2025/08/05/business/dealbook/clay-ai-marketing-fundraise.html, Forbes http://google.com/search?q=forbes+clay&amp;rlz=1C5OZZY_enUS1155US1155&amp;oq=forbes+clay&amp;gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIHCAEQABiABDIHCAIQABiABDIHCAMQABiABDIHCAQQABiABDIHCAUQABiABDIHCAYQABiABDIHCAcQABiABDIHCAgQABiABDIHCAkQABiABNIBBzkzM2owajSoAgOwAgHxBVAe8UAxJx_p&amp;sourceid=chrome&amp;ie=UTF-8, First Round Review https://review.firstround.com/podcast/inside-clays-unconventional-path-to-1-25b/, and more https://www.clay.com/press.

Hear from our employees directly on our Glassdoor https://www.glassdoor.com/Overview/Working-at-Clay-EI_IE9850794.11,15.htm page!


ABOUT THE TEAM

Clay&#39;s product is increasingly powered by AI agents — systems that research, enrich, and take action on behalf of our users, not just generate text. These aren&#39;t lightweight copilots layered onto an existing product; they&#39;re long-horizon agents built to take on the kind of multi-step, judgment-heavy work that skilled GTM teams spend real time on today. Several teams are working on different layers of this: agents that execute real go-to-market workflows end-to-end, and the shared platform (harness, memory, tools, retrieval, evals) that those agents run on.

This role is a shared entry point across those teams. Depending on your background and interests, you&#39;ll be matched to a specific team as you move through the process - but every team here is working on the same underlying problem: closing the gap between an agent that looks good in a demo and one that&#39;s dependable enough to run unattended in production.



ABOUT THE ROLE

You&#39;ll work closely with product, research-adjacent teammates, and other engineers to make sure agents aren&#39;t just capable, but reliable, steerable, and worth trusting with real work. That means the job isn&#39;t only about improving model behavior in isolation - it&#39;s about turning those improvements into measurable gains in task completion, reliability, and time saved for the people using them.


WHAT YOU&#39;LL DO

Depending on the team, you might work on:

Agent products

 - Design and iterate on agent behavior across real GTM workflows. For example, sourcing a Total Addressable Market (TAM) list, which in practice means navigating ambiguous Ideal Customer Profile (ICP) definitions, reconciling conflicting signals across data sources, and making judgment calls that experienced analysts spend real time on.

 - Map manual, multi-step workflows that GTM teams do today and turn them into agent-driven flows that are as good as, or better than, a human doing it by hand.

 - Build and run evals that measure whether an agent actually completed the task correctly - not just whether the output looked plausible - and use them to catch regressions and failure modes.

 - Analyze real failures in production and systematically improve robustness.

 - Work with product to take agent flows from early prototype through closed beta and into general availability, and help define what &quot;good&quot; looks like for each one.

Agent platform &amp; infrastructure

 - Build the core agent harness that other teams build on top of, including memory systems, tool infrastructure, and retrieval architecture

 - Improve agent performance through prompting strategies, tool-use design, and context construction

 - Design guardrails and safety checks so agents behave predictably in production

 - Build a cross-surface evals framework so every team building on the platform can measure quality, regressions, and performance the same way

 - Build feedback loops that turn real usage and production logs into better prompts, tools, and eval coverage over time

 - Support teams building their own forks or variants of the managed agent for their specific use case


WHAT YOU&#39;LL BRING

 - Experience building or shipping production systems with LLMs or agents. This might look like multi-step agent orchestration, prompting and tool-use design, retrieval, structured extraction, or fine-tuning.

 - Strong backend fundamentals in APIs, databases, distributed systems.

 - Experience with model or agent evaluation: designing evals, measuring regressions, or turning fuzzy quality questions into measurable signals

 - A systems-and-outcomes mindset. You care about whether the product actually works for users, not just about model metrics in isolation

 - Comfort debugging messy, real-world failures and a bias toward shipping and iterating quickly in a space where best practices are still being figured out


NICE TO HAVES

 - Experience with agent frameworks, tool-calling systems, or retrieval architectures (vector search, hybrid search, RAG)

 - Experience building or maintaining eval/benchmark infrastructure for LLM-based systems, or running fine-tuning in production

 - Experience with GTM, sales, or marketing workflows (e.g. lead sourcing, enrichment, audience building)

 - Familiarity with Clay&#39;s stack: React, TypeScript, Python, AWS (Aurora/Postgres, ECS/Fargate, Lambda, OpenSearch, Clickhouse, Elasticache/Redis), Terraform, Datadog

 - A growth mindset - we&#39;re building a team that&#39;s curious, open-minded, and happy to invest in each other&#39;s learning, not just their own" />

/u></a>.</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\">Hear from our employees directly on our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Clay-EI_IE9850794.11,15.htm\"><u>Glassdoor</u></a> page!</p><h2><strong>About the Team</strong></h2><p style=\"min-height:1.5em\">Clay's product is increasingly powered by AI agents — systems that research, enrich, and take action on behalf of our users, not just generate text. These aren't lightweight copilots layered onto an existing product; they're long-horizon agents built to take on the kind of multi-step, judgment-heavy work that skilled GTM teams spend real time on today. Several teams are working on different layers of this: agents that execute real go-to-market workflows end-to-end, and the shared platform (harness, memory, tools, retrieval, evals) that those agents run on.</p><p style=\"min-height:1.5em\">This role is a shared entry point across those teams. Depending on your background and interests, you'll be matched to a specific team as you move through the process - but every team here is working on the same underlying problem: closing the gap between an agent that looks good in a demo and one that's dependable enough to run unattended in production.<br /></p><h2><strong>About the Role</strong></h2><p style=\"min-height:1.5em\">You'll work closely with product, research-adjacent teammates, and other engineers to make sure agents aren't just capable, but reliable, steerable, and worth trusting with real work. That means the job isn't only about improving model behavior in isolation - it's about turning those improvements into measurable gains in task completion, reliability, and time saved for the people using them.</p><h2><strong>What You'll Do</strong></h2><p style=\"min-height:1.5em\">Depending on the team, you might work on:</p><p style=\"min-height:1.5em\"><strong>Agent products</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Design and iterate on agent behavior across real GTM workflows. For example, sourcing a Total Addressable Market (TAM) list, which in practice means navigating ambiguous Ideal Customer Profile (ICP) definitions, reconciling conflicting signals across data sources, and making judgment calls that experienced analysts spend real time on.</p></li><li><p style=\"min-height:1.5em\">Map manual, multi-step workflows that GTM teams do today and turn them into agent-driven flows that are as good as, or better than, a human doing it by hand.</p></li><li><p style=\"min-height:1.5em\">Build and run evals that measure whether an agent actually completed the task correctly - not just whether the output looked plausible - and use them to catch regressions and failure modes.</p></li><li><p style=\"min-height:1.5em\">Analyze real failures in production and systematically improve robustness.</p></li><li><p style=\"min-height:1.5em\">Work with product to take agent flows from early prototype through closed beta and into general availability, and help define what \"good\" looks like for each one.</p></li></ul><p style=\"min-height:1.5em\"><strong>Agent platform &amp; infrastructure</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build the core agent harness that other teams build on top of, including memory systems, tool infrastructure, and retrieval architecture</p></li><li><p style=\"min-height:1.5em\">Improve agent performance through prompting strategies, tool-use design, and context construction</p></li><li><p style=\"min-height:1.5em\">Design guardrails and safety checks so agents behave predictably in production</p></li><li><p style=\"min-height:1.5em\">Build a cross-surface evals framework so every team building on the platform can measure quality, regressions, and performance the same way</p></li><li><p style=\"min-height:1.5em\">Build feedback loops that turn real usage and production logs into better prompts, tools, and eval coverage over time</p></li><li><p style=\"min-height:1.5em\">Support teams building their own forks or variants of the managed agent for their specific use case</p></li></ul><h2><strong>What You'll Bring</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience building or shipping production systems with LLMs or agents. This might look like multi-step agent orchestration, prompting and tool-use design, retrieval, structured extraction, or fine-tuning.</p></li><li><p style=\"min-height:1.5em\">Strong backend fundamentals in APIs, databases, distributed systems.</p></li><li><p style=\"min-height:1.5em\">Experience with model or agent evaluation: designing evals, measuring regressions, or turning fuzzy quality questions into measurable signals</p></li><li><p style=\"min-height:1.5em\">A systems-and-outcomes mindset. You care about whether the product actually works for users, not just about model metrics in isolation</p></li><li><p style=\"min-height:1.5em\">Comfort debugging messy, real-world failures and a bias toward shipping and iterating quickly in a space where best practices are still being figured out</p></li></ul><h2><strong>Nice to Haves</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience with agent frameworks, tool-calling systems, or retrieval architectures (vector search, hybrid search, RAG)</p></li><li><p style=\"min-height:1.5em\">Experience building or maintaining eval/benchmark infrastructure for LLM-based systems, or running fine-tuning in production</p></li><li><p style=\"min-height:1.5em\">Experience with GTM, sales, or marketing workflows (e.g. lead sourcing, enrichment, audience building)</p></li><li><p style=\"min-height:1.5em\">Familiarity with Clay's stack: React, TypeScript, Python, AWS (Aurora/Postgres, ECS/Fargate, Lambda, OpenSearch, Clickhouse, Elasticache/Redis), Terraform, Datadog</p></li><li><p style=\"min-height:1.5em\">A growth mindset - we're building a team that's curious, open-minded, and happy to invest in each other's learning, not just their own</p></li></ul>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Clay Labs","value":"5e07db20-d96a-4dff-b7d3-3bf1cdde6fc1"},"datePosted":"2026-08-14","hiringOrganization":{"@type":"Organization","name":"Clay Labs","sameAs":"https://www.clay.com/","logo":"https://app.ashbyhq.com/api/images/org-theme-logo/b3bc4a8f-e1d4-4155-a49d-3e419d59328c/f1e23199-0119-44d8-8711-8576bdc8324e/d65c1be1-6686-4da0-bc7b-f67595836afd.png"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"New York","addressRegion":"NY","addressCountry":"United States"}},"employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":170000,"maxValue":300000,"unitText":"YEAR"}},"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"United States"}}</script>

ue.</p><p style=\"min-height:1.5em\">In 2026, we announced our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.nytimes.com/2026/01/28/business/dealbook/clay-start-up-tender-offers.html\">second employee tender offer</a> in 9 months at a new $5B valuation. We also launched a <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.clay.com/blog/community-equity-offering\"><u>community equity round</u></a>, for our customers, agency partners, and club members.</p><p style=\"min-height:1.5em\">Some things to know about us:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://community.clay.com\"><u>community</u></a> includes 11,000+ customers, 150+ integration partners, 125+ agencies, 50+ <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://luma.com/claylive\"><u>Clay clubs</u></a>, and 30k members on Slack.</p></li><li><p style=\"min-height:1.5em\">Our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://nextplayso.substack.com/p/spotlight-clay\"><u>culture</u></a><em> </em>is unique inside <em>and </em>outside of work. Our team members are also DJs, activists, writers, clowns, marathoners, skydivers, psychedelic therapists, social workers, and more.</p></li><li><p style=\"min-height:1.5em\">All employees can work for free with world-class coaches who specialize in creativity, management, and more.</p></li><li><p style=\"min-height:1.5em\">Our operating principles — including negative maintenance and non-attached action — guide our work. Read more about them <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://cdn.prod.website-files.com/61477f2c24a826836f969afe/685d83a71452245cc1129791_4d770abfd83e276ec15315a2e06945bd_Clay2025_OperatingPrinciples.pdf\"><u>here</u></a>.</p></li><li><p style=\"min-height:1.5em\">Read about us in the <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.nytimes.com/2025/08/05/business/dealbook/clay-ai-marketing-fundraise.html\"><u>NYT</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://google.com/search?q=forbes+clay&amp;rlz=1C5OZZY_enUS1155US1155&amp;oq=forbes+clay&amp;gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIHCAEQABiABDIHCAIQABiABDIHCAMQABiABDIHCAQQABiABDIHCAUQABiABDIHCAYQABiABDIHCAcQABiABDIHCAgQABiABDIHCAkQABiABNIBBzkzM2owajSoAgOwAgHxBVAe8UAxJx_p&amp;sourceid=chrome&amp;ie=UTF-8\"><u>Forbes</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://review.firstround.com/podcast/inside-clays-unconventional-path-to-1-25b/\"><u>First Round Review</u></a>, <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.clay.com/press\"><u>and more</u></a>.</p><p style=\"min-height:1.5em\"></p></li></ul><p style=\"min-height:1.5em\">Hear from our employees directly on our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.glassdoor.com/Overview/Working-at-Clay-EI_IE9850794.11,15.htm\"><u>Glassdoor</u></a> page!</p><h2><strong>About the Team</strong></h2><p style=\"min-height:1.5em\">Clay's product is increasingly powered by AI agents — systems that research, enrich, and take action on behalf of our users, not just generate text. These aren't lightweight copilots layered onto an existing product; they're long-horizon agents built to take on the kind of multi-step, judgment-heavy work that skilled GTM teams spend real time on today. Several teams are working on different layers of this: agents that execute real go-to-market workflows end-to-end, and the shared platform (harness, memory, tools, retrieval, evals) that those agents run on.</p><p style=\"min-height:1.5em\">This role is a shared entry point across those teams. Depending on your background and interests, you'll be matched to a specific team as you move through the process - but every team here is working on the same underlying problem: closing the gap between an agent that looks good in a demo and one that's dependable enough to run unattended in production.<br /></p><h2><strong>About the Role</strong></h2><p style=\"min-height:1.5em\">You'll work closely with product, research-adjacent teammates, and other engineers to make sure agents aren't just capable, but reliable, steerable, and worth trusting with real work. That means the job isn't only about improving model behavior in isolation - it's about turning those improvements into measurable gains in task completion, reliability, and time saved for the people using them.</p><h2><strong>What You'll Do</strong></h2><p style=\"min-height:1.5em\">Depending on the team, you might work on:</p><p style=\"min-height:1.5em\"><strong>Agent products</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Design and iterate on agent behavior across real GTM workflows. For example, sourcing a Total Addressable Market (TAM) list, which in practice means navigating ambiguous Ideal Customer Profile (ICP) definitions, reconciling conflicting signals across data sources, and making judgment calls that experienced analysts spend real time on.</p></li><li><p style=\"min-height:1.5em\">Map manual, multi-step workflows that GTM teams do today and turn them into agent-driven flows that are as good as, or better than, a human doing it by hand.</p></li><li><p style=\"min-height:1.5em\">Build and run evals that measure whether an agent actually completed the task correctly - not just whether the output looked plausible - and use them to catch regressions and failure modes.</p></li><li><p style=\"min-height:1.5em\">Analyze real failures in production and systematically improve robustness.</p></li><li><p style=\"min-height:1.5em\">Work with product to take agent flows from early prototype through closed beta and into general availability, and help define what \"good\" looks like for each one.</p></li></ul><p style=\"min-height:1.5em\"><strong>Agent platform &amp; infrastructure</strong></p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Build the core agent harness that other teams build on top of, including memory systems, tool infrastructure, and retrieval architecture</p></li><li><p style=\"min-height:1.5em\">Improve agent performance through prompting strategies, tool-use design, and context construction</p></li><li><p style=\"min-height:1.5em\">Design guardrails and safety checks so agents behave predictably in production</p></li><li><p style=\"min-height:1.5em\">Build a cross-surface evals framework so every team building on the platform can measure quality, regressions, and performance the same way</p></li><li><p style=\"min-height:1.5em\">Build feedback loops that turn real usage and production logs into better prompts, tools, and eval coverage over time</p></li><li><p style=\"min-height:1.5em\">Support teams building their own forks or variants of the managed agent for their specific use case</p></li></ul><h2><strong>What You'll Bring</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience building or shipping production systems with LLMs or agents. This might look like multi-step agent orchestration, prompting and tool-use design, retrieval, structured extraction, or fine-tuning.</p></li><li><p style=\"min-height:1.5em\">Strong backend fundamentals in APIs, databases, distributed systems.</p></li><li><p style=\"min-height:1.5em\">Experience with model or agent evaluation: designing evals, measuring regressions, or turning fuzzy quality questions into measurable signals</p></li><li><p style=\"min-height:1.5em\">A systems-and-outcomes mindset. You care about whether the product actually works for users, not just about model metrics in isolation</p></li><li><p style=\"min-height:1.5em\">Comfort debugging messy, real-world failures and a bias toward shipping and iterating quickly in a space where best practices are still being figured out</p></li></ul><h2><strong>Nice to Haves</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience with agent frameworks, tool-calling systems, or retrieval architectures (vector search, hybrid search, RAG)</p></li><li><p style=\"min-height:1.5em\">Experience building or maintaining eval/benchmark infrastructure for LLM-based systems, or running fine-tuning in production</p></li><li><p style=\"min-height:1.5em\">Experience with GTM, sales, or marketing workflows (e.g. lead sourcing, enrichment, audience building)</p></li><li><p style=\"min-height:1.5em\">Familiarity with Clay's stack: React, TypeScript, Python, AWS (Aurora/Postgres, ECS/Fargate, Lambda, OpenSearch, Clickhouse, Elasticache/Redis), Terraform, Datadog</p></li><li><p style=\"min-height:1.5em\">A growth mindset - we're building a team that's curious, open-minded, and happy to invest in each other's learning, not just their own</p></li></ul>","secondaryLocationNames":[],"teamNames":["Engineering"],"compensationTierSummary":"$170K – $300K • Offers Equity","compensationTiers":[{"id":"a942f97c-0425-4c29-aff8-ef11f89dbd50","title":null,"tierSummary":"$170K – $300K • Offers Equity"}],"applicationDeadline":null,"compensationTierGuideUrl":null,"scrapeableCompensationSalarySummary":"$170K - $300K","compensationPhilosophyHtml":null,"shouldAskForTextingConsent":true,"shouldAskForWhatsAppConsent":false,"candidateTextingPrivacyPolicyUrl":"https://privacy.clay.com/policies","candidateTextingTermsAndConditionsUrl":"https://www.clay.com/terms-of-service","legalEntityNameForTextingConsent":"Clay"},"jobBoard":null,"routerPrefix":"/","recaptchaPublicSiteKey":"6LeFb_YUAAAAALUD5h-BiQEp8JaFChe0e0A6r49Y","recaptchaUniversalPublicSiteKey":"6LezdY0tAAAAAEnollNLCAI0z1VDGwM7AzGrU4XZ"};
